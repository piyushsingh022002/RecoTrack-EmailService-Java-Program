name: Create GitHub issues from TASKS.md

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create issues from TASKS.md
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const TASK_FILE = 'TASKS.md';
            const TITLE_MAX_LENGTH = 120;
            const ELLIPSIS = '…';

            if (!fs.existsSync(TASK_FILE)) {
              core.setFailed(`❌ ${TASK_FILE} not found`);
              return;
            }

            const markdown = fs.readFileSync(TASK_FILE, 'utf8')
              .replace(/\r\n/g, '\n'); // normalize newlines

            /**
             * Parse tasks in format:
             * **T8 [Priority P1]**
             * **Requirement:** ...
             * **Desired Result:** ...
             */
            function parseTasks(text) {
              const taskRegex =
                /\*\*(T\d+)\s*\[\s*Priority\s*(P[1-3])\s*\]\*\*([\s\S]*?)(?=\n\s*\*\*T\d+\s*\[|\s*$)/g;

              const tasks = [];
              let match;

              while ((match = taskRegex.exec(text)) !== null) {
                const [, id, priority, body] = match;

                const reqMatch = body.match(
                  /\*\*Requirement:\*\*\s*([\s\S]*?)(?=\n\s*\*\*Desired Result:\*\*)/
                );

                const resMatch = body.match(
                  /\*\*Desired Result:\*\*\s*([\s\S]*)/
                );

                if (!reqMatch || !resMatch) continue;

                tasks.push({
                  id,
                  priority,
                  requirement: reqMatch[1].replace(/\s+/g, ' ').trim(),
                  desiredResult: resMatch[1].replace(/\s+/g, ' ').trim(),
                });
              }

              return tasks;
            }

            const tasks = parseTasks(markdown);

            if (!tasks.length) {
              core.setFailed('❌ No tasks found in TASKS.md');
              return;
            }

            core.info(`✅ Parsed ${tasks.length} tasks`);

            /**
             * Priority labels
             */
            const labelMap = {
              P1: 'priority: high',
              P2: 'priority: medium',
              P3: 'priority: low',
            };

            const labelDetails = {
              'priority: high':   { color: 'd73a4a', description: 'High priority task' },
              'priority: medium': { color: 'dbab09', description: 'Medium priority task' },
              'priority: low':    { color: '0e8a16', description: 'Low priority task' },
            };

            /**
             * Load existing issue titles (open + closed)
             */
            const existingTitles = new Set();
            for await (const { data } of github.paginate.iterator(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                per_page: 100,
              }
            )) {
              data.forEach(issue => existingTitles.add(issue.title));
            }

            let created = 0;
            const createdTitles = [];

            for (const task of tasks) {
              let title = `${task.id} - ${task.requirement}`;
              if (title.length > TITLE_MAX_LENGTH) {
                title = title.slice(0, TITLE_MAX_LENGTH - ELLIPSIS.length) + ELLIPSIS;
              }

              if (existingTitles.has(title)) {
                core.info(`↩️ Skipped existing issue: ${title}`);
                continue;
              }

              const label = labelMap[task.priority];

              // Ensure label exists
              if (label) {
                try {
                  await github.rest.issues.getLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label,
                  });
                } catch (err) {
                  if (err.status === 404) {
                    const { color, description } = labelDetails[label];
                    await github.rest.issues.createLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      name: label,
                      color,
                      description,
                    });
                  } else {
                    throw err;
                  }
                }
              }

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  `**Requirement:**`,
                  task.requirement,
                  ``,
                  `**Desired Result:**`,
                  task.desiredResult,
                ].join('\n'),
                labels: label ? [label] : [],
              });

              created++;
              createdTitles.push(title);
            }

            await core.summary
              .addHeading('📋 TASKS.md → GitHub Issues')
              .addRaw(
                created
                  ? `✅ Created **${created}** issue(s).\n\n• First: ${createdTitles[0]}\n• Last: ${createdTitles.at(-1)}`
                  : 'ℹ️ No new issues created (all tasks already exist).'
              )
              .write();
