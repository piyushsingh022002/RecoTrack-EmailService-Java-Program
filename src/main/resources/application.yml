server:
  port: 8080

jwt:
  user:
    secret: ""
    issuer: "RecoTrackAPI - Service"
    audience: "RecoTrackWeb - Client"
    clock-skew-seconds: 0

  service:
    secret: ""
    issuer: "RecoTrackAPI - Service"
    audience: "RecoTrackAPI - Email-Service"
    clock-skew-seconds: 0

spring:
  mail:
    host: smtp.sendgrid.net
    port: 587
    username: apikey
    password: ${SENDGRID_API_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
